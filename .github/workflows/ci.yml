name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: C++ core (build, tests, quick experiments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
      - name: Unit tests
        run: ./core/build/cdn_tests
      - name: Smoke-run every experiment (quick matrix)
        run: ./core/build/cdnopt experiment all --quick --out-dir /tmp/quick-results

  dashboard:
    name: Dashboard (type-check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
